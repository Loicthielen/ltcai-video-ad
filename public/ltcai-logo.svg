<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" fill="none">
  <defs>
    <linearGradient id="ltcGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="60%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <!-- Mark: stylized "L" cradling a node -->
  <g transform="translate(20, 30)">
    <path d="M0 0 L0 130 L80 130" stroke="url(#ltcGrad)" stroke-width="14" stroke-linecap="round" fill="none"/>
    <circle cx="80" cy="130" r="14" fill="url(#aiGrad)"/>
    <circle cx="80" cy="130" r="22" stroke="url(#aiGrad)" stroke-width="3" fill="none" opacity="0.5"/>
  </g>
  <!-- Wordmark -->
  <text x="150" y="125" font-family="Inter, sans-serif" font-weight="800" font-size="92" letter-spacing="-2" fill="#F8FAFC">LTC</text>
  <text x="380" y="125" font-family="Inter, sans-serif" font-weight="800" font-size="92" letter-spacing="-1" fill="url(#aiGrad)">AI</text>
</svg>
